[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personalized-fashion-ranking"
version = "0.1.0"
description = "Temporal recommendation and learning-to-rank experiments on H&M transactions"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "pyarrow>=12", "matplotlib>=3.7", "xgboost>=2.0,<4", "lightgbm>=4.0,<5"]

[project.scripts]
fashion-ranking = "ranking.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
